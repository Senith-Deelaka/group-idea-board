<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCSC Student Dashboard</title>
    <style>
        :root {
            /* UCSC Branding Colors */
            --primary: #800000; /* Maroon */
            --primary-hover: #600000;
            --secondary: #FFD700; /* Gold */
            --secondary-hover: #e6c200;
            --accent: var(--secondary);
            --ucsc-maroon: var(--primary);
            --ucsc-gold-glow: rgba(255, 215, 0, 0.4);
            
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-gradient: radial-gradient(circle at top left, #f8fafc, #e2e8f0);
            --card-bg: #ffffff;
            --navbar-bg: var(--ucsc-maroon);
            --sidebar-bg: #ffffff;
            --text-main: #0f172a;
            --text-on-dark: #ffffff;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --navbar-height: 72px;
            --sidebar-width: 260px;
            --transition-speed: 0.3s;
        }

        body.dark-mode {
            --bg-gradient: radial-gradient(circle at top left, #121212, #1a0508);
            --card-bg: #1e1e1e;
            --navbar-bg: #000000;
            --sidebar-bg: #1f1f1f;
            --text-main: #e0e0e0;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        /* Fade-In Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in {
                animation: none;
                opacity: 1;
            }
        }

        * {
            box-sizing: border-box;
            transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease, border-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navbar Styles */
        nav {
            height: var(--navbar-height);
            background: var(--navbar-bg);
            border-bottom: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 800;
            font-size: 1.25rem;
        }

        .ucsc-logo {
            height: 45px;
            width: auto;
            border-radius: 6px;
            transition: transform 0.3s ease;
        }

        .ucsc-logo:hover {
            transform: scale(1.05);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
            border-radius: 6px;
            opacity: 0.8;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn.active {
            opacity: 1;
            background: var(--secondary);
            color: var(--primary);
        }

        /* Theme Toggle Switch */
        .theme-switch {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            color: white;
        }

        .theme-switch:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        header {
            width: 100%;
            background: var(--ucsc-maroon);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--secondary);
        }

        header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1rem;
            max-width: 600px;
        }

        /* Layout Wrapper */
        .content-wrapper {
            display: flex;
            gap: 2rem;
            width: 95%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin: 0 auto 4rem auto;
            position: relative;
            border: 1px solid var(--border);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .counter-badge {
            position: absolute;
            top: -12px;
            right: 2rem;
            background: var(--primary);
            color: var(--secondary);
            padding: 0.25rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 700;
            box-shadow: 0 4px 6px rgba(128, 0, 0, 0.3);
            z-index: 10;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .inline-group {
            display: flex;
            gap: 0.5rem;
        }

        .input-field {
            flex: 1;
        }

        label {
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        body.dark-mode label {
            color: var(--secondary);
        }

        select, input[type="text"], input[type="number"] {
            padding: 0.875rem 1.25rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-main);
            width: 100%;
        }

        select:focus, input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(128, 0, 0, 0.1);
        }

        body.dark-mode select:focus, body.dark-mode input[type="text"]:focus, body.dark-mode input[type="number"]:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
        }

        .button-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        button {
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(128, 0, 0, 0.3);
        }

        .btn-secondary {
            background-color: var(--secondary);
            color: var(--primary);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
            transform: translateY(-2px);
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-success:hover {
            background-color: var(--success-hover);
            transform: scale(1.02);
        }

        .btn-danger {
            background-color: #fee2e2;
            color: var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-clear {
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .btn-clear:hover {
            background-color: #e2e8f0;
        }

        /* GPA Calculator Styles */
        .gpa-form {
            display: grid;
            grid-template-columns: 2fr 1fr 1.5fr auto;
            gap: 1rem;
            align-items: flex-end;
        }

        .gpa-result-card {
            background: var(--primary);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-top: 2rem;
        }

        .gpa-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--secondary);
            display: block;
        }

        #idea-list, #course-list {
            margin-top: 1rem;
            padding: 0;
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .list-item {
            background: var(--card-bg);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .item-icon {
            background: rgba(128, 0, 0, 0.05);
            color: var(--primary);
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .item-content {
            flex: 1;
            font-weight: 500;
        }

        .item-subtitle {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
            font-weight: 400;
        }

        footer {
            margin-top: auto;
            padding: 3rem;
            text-align: center;
            color: white;
            font-size: 0.9rem;
            width: 100%;
            background: var(--ucsc-maroon);
            border-top: 4px solid var(--accent);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @media (max-width: 768px) {
            .gpa-form {
                grid-template-columns: 1fr 1fr;
            }
            .gpa-form .btn-primary {
                grid-column: span 2;
            }
            .button-row { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .container { padding: 1.5rem; }
            header h1 { font-size: 2rem; }
            .nav-tabs { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <img src="images.png" alt="UCSC Logo" class="ucsc-logo">
            <span>UCSC Dashboard</span>
        </div>
        <div class="nav-actions">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('idea-board')">Idea Board</button>
                <button class="tab-btn" onclick="switchTab('gpa-calc')">GPA Calculator</button>
            </div>
            <button id="theme-toggle" class="theme-switch" title="Toggle Theme">
                <span id="theme-icon">☀️</span>
            </button>
        </div>
    </nav>

    <header>
        <h1 id="header-title">Group Idea Board</h1>
        <p id="header-desc">Collaborate and build the future together</p>
    </header>

    <main class="container">
        
        <!-- Tab 1: Idea Board -->
        <section id="idea-board" class="tab-content active">
            <div id="idea-counter" class="counter-badge">0 Ideas</div>

            <div class="input-group">
                <label for="new-name-input">Register Member</label>
                <div class="inline-group">
                    <div class="input-field">
                        <input type="text" id="new-name-input" placeholder="Type name to add...">
                    </div>
                    <button id="add-name-btn" class="btn-success">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    </button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 0.5rem 0;">

            <div class="input-group">
                <label for="name-select">Select Member</label>
                <div class="inline-group">
                    <div class="input-field">
                        <select id="name-select">
                            <option value="" disabled selected>Select your name...</option>
                            <option value="Suthakaran Sabhisha">Sabisa</option>
                            <option value="Sasandi Jayawardena">Sasandi</option>
                            <option value="Ketheeswaran Janani">Janani</option>
                            <option value="Nadina Amarasinghe">Nadina</option>
                        </select>
                    </div>
                    <button id="remove-name-btn" class="btn-danger" title="Remove selected member">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="idea-input">The Big Idea</label>
                <input type="text" id="idea-input" placeholder="What are you thinking?">
            </div>

            <div class="button-row">
                <button id="add-idea-btn" class="btn-primary">Add Idea to Board</button>
                <button id="reset-btn" class="btn-clear">Clear</button>
            </div>

            <ul id="idea-list">
                <div class="empty-state" style="text-align: center; color: var(--text-muted); padding: 2rem;">No ideas yet.</div>
            </ul>
        </section>

        <!-- Tab 2: GPA Calculator -->
        <section id="gpa-calc" class="tab-content">
            <div class="gpa-form">
                <div class="input-group">
                    <label>Course Name</label>
                    <input type="text" id="course-name" placeholder="Optional">
                </div>
                <div class="input-group">
                    <label>Credits</label>
                    <input type="number" id="course-credits" placeholder="e.g. 3" min="1">
                </div>
                <div class="input-group">
                    <label>Grade</label>
                    <select id="course-grade">
                        <option value="4.0">A</option>
                        <option value="3.7">A-</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">B-</option>
                        <option value="2.3">C+</option>
                        <option value="2.0">C</option>
                        <option value="1.7">C-</option>
                        <option value="1.3">D+</option>
                        <option value="1.0">D</option>
                        <option value="0.0">E</option>
                    </select>
                </div>
                <button id="add-course-btn" class="btn-primary">Add</button>
            </div>

            <div id="course-list-container">
                <ul id="course-list">
                    <!-- Courses will appear here -->
                </ul>
            </div>

            <div class="button-row" style="grid-template-columns: 1fr;">
                <button id="calculate-gpa-btn" class="btn-secondary" style="font-size: 1.2rem; padding: 1.25rem;">
                    Calculate Final GPA
                </button>
            </div>

            <div id="gpa-result-display" class="gpa-result-card" style="display: none;">
                <h3>Your Current GPA</h3>
                <span class="gpa-value" id="final-gpa">0.00</span>
                <p id="gpa-message">Keep up the great work!</p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 UCSC Student Dashboard. Academic Excellence through Innovation.</p>
    </footer>

    <script>
        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            const title = document.getElementById('header-title');
            const desc = document.getElementById('header-desc');

            if (tabId === 'idea-board') {
                title.textContent = 'Group Idea Board';
                desc.textContent = 'Collaborate and build the future together';
            } else {
                title.textContent = 'GPA Calculator';
                desc.textContent = 'Track your academic progress with precision';
            }
        }

        // --- Idea Board Logic ---
        const nameSelect = document.getElementById('name-select');
        const newNameInput = document.getElementById('new-name-input');
        const addNameBtn = document.getElementById('add-name-btn');
        const removeNameBtn = document.getElementById('remove-name-btn');
        const ideaInput = document.getElementById('idea-input');
        const addIdeaBtn = document.getElementById('add-idea-btn');
        const resetBtn = document.getElementById('reset-btn');
        const ideaList = document.getElementById('idea-list');
        const counterBadge = document.getElementById('idea-counter');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        let members = JSON.parse(localStorage.getItem('boardMembers')) || [
            'Suthakaran Sabhisha', 'Sasandi Jayawardena', 'Ketheeswaran Janani', 
            'Nadina Amarasinghe', 'Chamindu Garusingha', 'Pramuditha Maduwantha', 
            'Savinda Rajapathirana', 'Senith Deelaka', 'Chamalkith Dewmina', 'Dulan Senanayake'
        ];
        let ideas = JSON.parse(localStorage.getItem('boardIdeas')) || [];

        function init() {
            renderMembers();
            renderIdeas();
        }

        function saveToStorage() {
            localStorage.setItem('boardMembers', JSON.stringify(members));
            localStorage.setItem('boardIdeas', JSON.stringify(ideas));
        }

        function renderMembers() {
            const currentSelection = nameSelect.value;
            nameSelect.innerHTML = '<option value="" disabled selected>Select your name...</option>';
            members.sort().forEach(member => {
                const option = document.createElement('option');
                option.value = member;
                option.textContent = member;
                nameSelect.appendChild(option);
            });
            if (members.includes(currentSelection)) {
                nameSelect.value = currentSelection;
            }
        }

        function renderIdeas() {
            ideaList.innerHTML = '';
            if (ideas.length === 0) {
                ideaList.innerHTML = '<div class="empty-state">No ideas collected yet. Start the brainstorm!</div>';
            } else {
                ideas.forEach((item, index) => {
                    const listItem = document.createElement('li');
                    listItem.innerHTML = `
                        <div class="idea-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                        </div>
                        <div class="idea-content">
                            ${escapeHTML(item.text)}
                            <span class="suggested-by">suggested by <strong>${escapeHTML(item.name)}</strong></span>
                        </div>
                        <button class="btn-delete-idea" onclick="deleteIdea(${index})" title="Remove idea">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    `;
                    ideaList.prepend(listItem);
                });
            }
            updateCounter();
        }

        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
                themeIcon.textContent = '🌙';
            } else {
                document.body.classList.remove('dark-mode');
                themeIcon.textContent = '☀️';
            }
            localStorage.setItem('theme', theme);
        }

        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme) {
            setTheme(savedTheme);
        } else if (systemPrefersDark) {
            setTheme('dark');
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark-mode');
            setTheme(isDark ? 'light' : 'dark');
        });

        function updateCounter() {
            counterBadge.textContent = `${ideas.length} ${ideas.length === 1 ? 'Idea' : 'Ideas'}`;
        }

        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        function deleteIdea(index) {
            if (confirm('Are you sure you want to delete this idea?')) {
                ideas.splice(index, 1);
                saveToStorage();
                renderIdeas();
            }
        }

        function joinEvent(eventName) {
            alert(`Awesome! You've joined the ${eventName}. See you there!`);
        }

        addNameBtn.addEventListener('click', () => {
            const newName = newNameInput.value.trim();
            if (!newName) return;
            const option = document.createElement('option');
            option.value = newName;
            option.textContent = newName;
            nameSelect.appendChild(option);
            nameSelect.value = newName;
            newNameInput.value = '';
        });

        removeNameBtn.addEventListener('click', () => {
            if (nameSelect.value) {
                nameSelect.remove(nameSelect.selectedIndex);
                nameSelect.value = "";
            }
        });

        addIdeaBtn.addEventListener('click', () => {
            const name = nameSelect.value;
            const idea = ideaInput.value.trim();
            if (!name || !idea) return;

            if (ideaList.querySelector('.empty-state')) ideaList.innerHTML = '';

            totalIdeas++;
            updateCounter();

            const li = document.createElement('li');
            li.className = 'list-item';
            li.innerHTML = `
                <div class="item-icon">💡</div>
                <div class="item-content">
                    ${idea}
                    <span class="item-subtitle">suggested by <strong>${name}</strong></span>
                </div>
            `;
            ideaList.prepend(li);
            ideaInput.value = '';
        });

        resetBtn.addEventListener('click', () => {
            ideaInput.value = '';
            ideaInput.focus();
        });

        // --- GPA Calculator Logic ---
        const courseNameInput = document.getElementById('course-name');
        const courseCreditsInput = document.getElementById('course-credits');
        const courseGradeSelect = document.getElementById('course-grade');
        const addCourseBtn = document.getElementById('add-course-btn');
        const courseList = document.getElementById('course-list');
        const calculateGpaBtn = document.getElementById('calculate-gpa-btn');
        const gpaResultDisplay = document.getElementById('gpa-result-display');
        const finalGpaText = document.getElementById('final-gpa');

        let courses = [];

        addCourseBtn.addEventListener('click', () => {
            const name = courseNameInput.value.trim() || 'Unnamed Course';
            const credits = parseFloat(courseCreditsInput.value);
            const gradePoint = parseFloat(courseGradeSelect.value);
            const gradeText = courseGradeSelect.options[courseGradeSelect.selectedIndex].text;

            if (isNaN(credits) || credits <= 0) {
                alert('Please enter valid credits.');
                return;
            }

            const course = { id: Date.now(), name, credits, gradePoint, gradeText };
            courses.push(course);
            renderCourses();
            
            courseNameInput.value = '';
            courseCreditsInput.value = '';
        });

        function renderCourses() {
            courseList.innerHTML = '';
            courses.forEach(course => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <div class="item-icon">📚</div>
                    <div class="item-content">
                        <strong>${course.name}</strong>
                        <span class="item-subtitle">${course.credits} Credits • Grade: ${course.gradeText}</span>
                    </div>
                    <button class="btn-danger" onclick="removeCourse(${course.id})" style="padding: 0.5rem;">×</button>
                `;
                courseList.appendChild(li);
            });
        }

        window.removeCourse = (id) => {
            courses = courses.filter(c => c.id !== id);
            renderCourses();
            gpaResultDisplay.style.display = 'none';
        };

        calculateGpaBtn.addEventListener('click', () => {
            if (courses.length === 0) {
                alert('Add some courses first!');
                return;
            }

            let totalQualityPoints = 0;
            let totalCredits = 0;

            courses.forEach(c => {
                totalQualityPoints += (c.gradePoint * c.credits);
                totalCredits += c.credits;
            });

            const gpa = totalQualityPoints / totalCredits;
            finalGpaText.textContent = gpa.toFixed(2);
            gpaResultDisplay.style.display = 'block';
            gpaResultDisplay.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>

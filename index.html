<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCSC Student Dashboard</title>
    <style>
        :root {
            /* UCSC Branding Colors */
            --primary: #800000; /* Maroon */
            --primary-hover: #600000;
            --secondary: #FFD700; /* Gold */
            --secondary-hover: #e6c200;
            --accent: var(--secondary);
            --ucsc-maroon: var(--primary);
            
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-gradient: radial-gradient(circle at top left, #f8fafc, #e2e8f0);
            --card-bg: #ffffff;
            --navbar-bg: var(--ucsc-maroon);
            --text-main: #0f172a;
            --text-on-dark: #ffffff;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
            --navbar-height: 72px;
            --transition-speed: 0.3s;
        }

        body.dark-mode {
            --bg-gradient: radial-gradient(circle at top left, #121212, #1a0508);
            --card-bg: #1e1e1e;
            --navbar-bg: #000000;
            --text-main: #e0e0e0;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Styles */
        nav {
            height: var(--navbar-height);
            background: var(--navbar-bg);
            border-bottom: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            color: white;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 800;
            font-size: 1.25rem;
        }

        .ucsc-logo {
            height: 45px;
            width: auto;
            border-radius: 6px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-weight: 600;
            border-radius: 6px;
            opacity: 0.8;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
        }

        .tab-btn.active {
            opacity: 1;
            background: var(--secondary);
            color: var(--primary);
        }

        .theme-switch {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        header {
            background: var(--ucsc-maroon);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .container {
            max-width: 900px;
            width: 95%;
            margin: 2rem auto;
            flex: 1;
        }

        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Elements */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        body.dark-mode label { color: var(--secondary); }

        input, select {
            padding: 0.875rem 1.25rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--card-bg);
            color: var(--text-main);
            width: 100%;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .inline-group {
            display: flex;
            gap: 0.5rem;
        }

        /* Buttons */
        .btn {
            padding: 0.875rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .btn-secondary { background: var(--secondary); color: var(--primary); }
        .btn-secondary:hover { background: var(--secondary-hover); transform: translateY(-2px); }

        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-clear { background: var(--border); color: var(--text-muted); }

        /* Lists */
        .list-container {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .list-item {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .item-icon {
            width: 40px; height: 40px;
            background: rgba(128, 0, 0, 0.05);
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; font-size: 1.2rem;
        }

        .item-content { flex: 1; }
        .item-subtitle { display: block; font-size: 0.85rem; color: var(--text-muted); }

        /* Timer Specific */
        .timer-container {
            display: flex; flex-direction: column; align-items: center; gap: 2rem;
        }

        .timer-circle {
            width: 250px; height: 250px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 4rem; font-weight: 800; color: white;
            box-shadow: var(--shadow);
        }

        /* GPA Result */
        .gpa-result-card {
            background: var(--primary); color: white;
            padding: 2rem; border-radius: 12px; text-align: center;
            margin-top: 1rem;
        }

        .gpa-value { font-size: 3rem; font-weight: 800; color: var(--secondary); }

        footer {
            background: var(--ucsc-maroon); color: white;
            padding: 2rem; text-align: center;
            border-top: 4px solid var(--accent);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .nav-tabs { display: none; }
            .inline-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <img src="images.png" alt="UCSC Logo" class="ucsc-logo" onerror="this.style.display='none'">
            <span>UCSC Dashboard</span>
        </div>
        <div class="nav-actions">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('idea-board')">Idea Board</button>
                <button class="tab-btn" onclick="switchTab('gpa-calc')">GPA Calculator</button>
                <button class="tab-btn" onclick="switchTab('timer')">Study Timer</button>
            </div>
            <button id="theme-toggle" class="theme-switch">☀️</button>
        </div>
    </nav>

    <header>
        <h1 id="header-title">Group Idea Board</h1>
        <p id="header-desc">Collaborate and build the future together</p>
    </header>

    <main class="container">
        <!-- Tab 1: Idea Board -->
        <section id="idea-board" class="tab-content active">
            <div class="input-group">
                <label>Register Member</label>
                <div class="inline-group">
                    <input type="text" id="new-name-input" placeholder="Member name...">
                    <button id="add-name-btn" class="btn btn-success">Add Member</button>
                </div>
            </div>

            <div class="input-group">
                <label>Select Member & Idea</label>
                <select id="name-select">
                    <option value="" disabled selected>Select member...</option>
                    <option value="Suthakaran Sabhisha">Sabisa</option>
                    <option value="Sasandi Jayawardena">Sasandi</option>
                    <option value="Ketheeswaran Janani">Janani</option>
                    <option value="Nadina Amarasinghe">Nadina</option>
                </select>
                <input type="text" id="idea-input" placeholder="What's your big idea?">
            </div>

            <div class="inline-group">
                <button id="add-idea-btn" class="btn btn-primary" style="flex: 2;">Post Idea</button>
                <button id="clear-idea-btn" class="btn btn-clear" style="flex: 1;">Clear</button>
            </div>

            <ul id="idea-list" class="list-container">
                <div class="empty-state" style="text-align: center; color: var(--text-muted); padding: 2rem;">No ideas posted yet.</div>
            </ul>
        </section>

        <!-- Tab 2: GPA Calculator -->
        <section id="gpa-calc" class="tab-content">
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 0.5rem; align-items: flex-end;">
                <div class="input-group">
                    <label>Course</label>
                    <input type="text" id="course-name" placeholder="e.g. CS101">
                </div>
                <div class="input-group">
                    <label>Credits</label>
                    <input type="number" id="course-credits" min="1" placeholder="3">
                </div>
                <div class="input-group">
                    <label>Grade</label>
                    <select id="course-grade">
                        <option value="4.0">A</option>
                        <option value="3.7">A-</option>
                        <option value="3.3">B+</option>
                        <option value="3.0">B</option>
                        <option value="2.7">B-</option>
                        <option value="2.3">C+</option>
                        <option value="2.0">C</option>
                        <option value="1.7">C-</option>
                        <option value="1.3">D+</option>
                        <option value="1.0">D</option>
                        <option value="0.0">E</option>
                    </select>
                </div>
                <button id="add-course-btn" class="btn btn-primary">Add</button>
            </div>

            <ul id="course-list" class="list-container"></ul>

            <button id="calculate-gpa-btn" class="btn btn-secondary" style="width: 100%; font-size: 1.2rem;">Calculate Final GPA</button>

            <div id="gpa-result-display" class="gpa-result-card" style="display: none;">
                <h3>Cumulative GPA</h3>
                <span class="gpa-value" id="final-gpa">0.00</span>
            </div>
        </section>

        <!-- Tab 3: Study Timer -->
        <section id="timer" class="tab-content">
            <div class="timer-container">
                <div class="timer-circle">
                    <span id="timer-display">25:00</span>
                </div>
                <div class="inline-group">
                    <button id="timer-start" class="btn btn-primary">Start Focus</button>
                    <button id="timer-reset" class="btn btn-secondary">Reset</button>
                </div>
                <div style="text-align: center; color: var(--text-muted);">
                    <p>Focus: 25m | Break: 5m</p>
                    <p id="session-count">Sessions completed: 0</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 UCSC Student Dashboard. Academic Excellence through Innovation.</p>
    </footer>

    <script>
        // --- Navigation ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.onclick.toString().includes(tabId));
            if(activeBtn) activeBtn.classList.add('active');

            const title = document.getElementById('header-title');
            const desc = document.getElementById('header-desc');
            if (tabId === 'idea-board') {
                title.textContent = 'Group Idea Board';
                desc.textContent = 'Collaborate and build the future together';
            } else if (tabId === 'gpa-calc') {
                title.textContent = 'GPA Calculator';
                desc.textContent = 'Track your academic progress';
            } else {
                title.textContent = 'Study Timer';
                desc.textContent = 'Boost productivity with Pomodoro';
            }
        }

        // --- Theme ---
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeToggle.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '☀️';
        });

        // --- Idea Board Logic ---
        const ideaList = document.getElementById('idea-list');
        const nameSelect = document.getElementById('name-select');
        
        document.getElementById('add-name-btn').addEventListener('click', () => {
            const input = document.getElementById('new-name-input');
            const name = input.value.trim();
            if (name) {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                nameSelect.appendChild(opt);
                nameSelect.value = name;
                input.value = '';
            }
        });

        document.getElementById('add-idea-btn').addEventListener('click', () => {
            const name = nameSelect.value;
            const ideaText = document.getElementById('idea-input').value.trim();
            if (!name || !ideaText) return;

            if (ideaList.querySelector('.empty-state')) ideaList.innerHTML = '';

            const li = document.createElement('li');
            li.className = 'list-item';
            li.innerHTML = `
                <div class="item-icon">💡</div>
                <div class="item-content">
                    <strong>${ideaText}</strong>
                    <span class="item-subtitle">Suggested by ${name}</span>
                </div>
            `;
            ideaList.prepend(li);
            document.getElementById('idea-input').value = '';
        });

        document.getElementById('clear-idea-btn').addEventListener('click', () => {
            document.getElementById('idea-input').value = '';
        });

        // --- GPA Logic ---
        let courses = [];
        document.getElementById('add-course-btn').addEventListener('click', () => {
            const name = document.getElementById('course-name').value || 'Course';
            const credits = parseFloat(document.getElementById('course-credits').value);
            const grade = parseFloat(document.getElementById('course-grade').value);
            const gradeText = document.getElementById('course-grade').options[document.getElementById('course-grade').selectedIndex].text;

            if (!credits) return;

            courses.push({ name, credits, grade, gradeText });
            renderCourses();
            document.getElementById('course-name').value = '';
            document.getElementById('course-credits').value = '';
        });

        function renderCourses() {
            const list = document.getElementById('course-list');
            list.innerHTML = '';
            courses.forEach((c, i) => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <div class="item-icon">📚</div>
                    <div class="item-content">
                        <strong>${c.name}</strong>
                        <span class="item-subtitle">${c.credits} Credits • Grade: ${c.gradeText}</span>
                    </div>
                    <button class="btn btn-danger" onclick="removeCourse(${i})" style="padding: 0.5rem;">×</button>
                `;
                list.appendChild(li);
            });
        }

        window.removeCourse = (i) => {
            courses.splice(i, 1);
            renderCourses();
        };

        document.getElementById('calculate-gpa-btn').addEventListener('click', () => {
            if (!courses.length) return;
            let totalPoints = 0, totalCredits = 0;
            courses.forEach(c => {
                totalPoints += (c.grade * c.credits);
                totalCredits += c.credits;
            });
            const gpa = totalPoints / totalCredits;
            document.getElementById('final-gpa').textContent = gpa.toFixed(2);
            document.getElementById('gpa-result-display').style.display = 'block';
        });

        // --- Timer Logic ---
        let timerSeconds = 25 * 60;
        let timerInterval = null;
        let sessions = 0;

        const display = document.getElementById('timer-display');
        const startBtn = document.getElementById('timer-start');

        function updateTimer() {
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            display.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        startBtn.addEventListener('click', () => {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                startBtn.textContent = 'Resume';
            } else {
                startBtn.textContent = 'Pause';
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    updateTimer();
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        sessions++;
                        document.getElementById('session-count').textContent = `Sessions completed: ${sessions}`;
                        alert('Focus session complete! Take a break.');
                        timerSeconds = 25 * 60;
                        updateTimer();
                        startBtn.textContent = 'Start Focus';
                    }
                }, 1000);
            }
        });

        document.getElementById('timer-reset').addEventListener('click', () => {
            clearInterval(timerInterval);
            timerInterval = null;
            timerSeconds = 25 * 60;
            updateTimer();
            startBtn.textContent = 'Start Focus';
        });
    </script>
</body>
</html>
